[package]
name = "ghenv"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
der = "0.7.10"
pkcs1 = "0.7.5"
spki = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.3"
libc = "0.2.186"
zeroize = "1.9.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
