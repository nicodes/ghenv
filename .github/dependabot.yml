      - golang.org/x/term
      - golang.org/x/text
      - golang.org/x/time
      - golang.org/x/tools
      - google.golang.org/api
      - google.golang.org/genproto/googleapis/api
      - google.golang.org/genproto/googleapis/rpc
      - modernc.org/sqlite
      - github.com/jackc/pgx/*
      - github.com/go-sql-driver/mysql
      - go.mongodb.org/mongo-driver/*
      update-types:
      - minor
      - patch
    managed-releases:
      patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - '*'
      exclude-patterns:
      - nicodes/tools/*
      - nicodes/cicd/*
      - nicodes/komizo-actions/*
      - aviorstudio/gdam-actions/*
      - '*clerk*'
      - '*pocketbase*'
      - '*crypto*'
      - '*jsonwebtoken*'
      - '*jose*'
      - '*oauth*'
      - '*openid*'
      - '*passport*'
      - '*bcrypt*'
      - '*argon2*'
      - '@noble/*'
      - '*prisma*'
      - '*drizzle*'
      - '*migrate*'
      - modernc.org/sqlite
      - github.com/jackc/pgx/*
      - github.com/go-sql-driver/mysql
      - go.mongodb.org/mongo-driver/*
