name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  release:
    name: Release
    uses: nicodes/tools/.github/workflows/cli-release.yml@091101094fedf5ce2e67c339c1c9c842d6a662dc
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      tools-ref: 091101094fedf5ce2e67c339c1c9c842d6a662dc
      bump: ${{ inputs.bump }}
      binary: ghenv
      version-symbol: main.version
      check-command: mise run check
