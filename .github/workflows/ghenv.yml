name: Local Environment
run-name: ghenv ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Local runs use Preview only
        type: choice
        options: [Preview]
        default: Preview
        required: true
      request_id:
        description: Random request identifier generated by the CLI
        required: true
      public_key:
        description: Base64 DER ephemeral RSA public key generated by the CLI
        required: true
      secret_names:
        description: Comma-separated secret names to export
        default: ''
      variable_names:
        description: Comma-separated variable names to export
        default: ''

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Preview
    steps:
      - name: Refuse other environments
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: test "$REQUESTED_ENVIRONMENT" = Preview
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build before exposing secrets
        run: go build -o "$RUNNER_TEMP/ghenv" .
      - name: Encrypt requested values
        env:
          GHENV_PREVIEW_BUNDLE: ${{ secrets.GHENV_PREVIEW_BUNDLE }}
          GHENV_SECRET_NAMES: ${{ inputs.secret_names }}
          GHENV_VAR_NAMES: ${{ inputs.variable_names }}
          GHENV_PUBLIC_KEY: ${{ inputs.public_key }}
          GHENV_REQUEST_ID: ${{ inputs.request_id }}
        run: '"$RUNNER_TEMP/ghenv" seal > "$RUNNER_TEMP/payload.json"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghenv-${{ inputs.request_id }}
          path: ${{ runner.temp }}/payload.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner ciphertext
        if: always()
        run: rm -f "$RUNNER_TEMP/payload.json"
