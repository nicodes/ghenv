[tools]
"python" = "3.13.11"
"rust" = "1.94.0"
"cargo:cargo-audit" = "0.22.2"
"actionlint" = "1.7.12"
"shellcheck" = "0.11.0"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
PYTHONDONTWRITEBYTECODE = "1"

[tasks."install"]
run = ["rustup component add --toolchain 1.94.0 rustfmt clippy", "cargo fetch --locked"]

[tasks."lint"]
run = ["cargo fmt --check", "cargo clippy --locked --all-targets -- -D warnings", "actionlint", "shellcheck scripts/build-release.sh"]

[tasks."unit"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name unit --artifact .artifacts/build -- mise run _unit"
depends = ["install"]

[tasks."build"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" build --name build --artifact .artifacts/build -- mise run _build"
depends = ["install"]

[tasks."artifact-check"]
run = ["python3 scripts/check_archives.py"]
depends = ["build"]

[tasks."vuln"]
run = ["cargo audit --file Cargo.lock --db .artifacts/advisory-db"]

[tasks."clean"]
run = ["python3 -c 'from pathlib import Path; import shutil; p=Path('\"'\"'.artifacts/build'\"'\"'); assert not p.parent.is_symlink() and not p.is_symlink(), '\"'\"'linked build output'\"'\"'; shutil.rmtree(p) if p.exists() else None'"]

[tasks."_build"]
run = ["bash scripts/build-release.sh"]
hide = true

[tasks."_unit"]
run = ["cargo test --locked", "cargo build --locked", "python3 tests/cli_test.py", "python3 tests/installer_test.py"]
hide = true

[tasks."_test-stages"]
run = [{"task" = "unit"}]
hide = true

[tasks."test"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _test-stages"

[tasks."_check-stages"]
run = [{"task" = "install"}, {"task" = "lint"}, {"task" = "unit"}, {"task" = "build"}, {"task" = "artifact-check"}, {"task" = "vuln"}]
hide = true

[tasks."check"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _check-stages"
