[tools]
"python" = "3.13.11"
"go" = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[env]
TOOLS_ROOT = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
GOTOOLCHAIN = "local"
PYTHONDONTWRITEBYTECODE = "1"

[tasks."install"]
run = ["go mod download"]

[tasks."lint"]
run = ["bash -euo pipefail -c 'test -z \"$(gofmt -l .)\"; go vet ./...'"]

[tasks."unit"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" test --name unit --artifact .artifacts/build -- mise run _unit"
depends = ["install"]

[tasks."build"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" build --name build --artifact .artifacts/build -- mise run _build"
depends = ["install"]

[tasks."artifact-check"]
run = ["python3 -c 'from pathlib import Path; import os; p=Path('\"'\"'.artifacts/build/app'\"'\"'); assert not p.is_symlink() and p.is_file() and p.stat().st_size and os.access(p,os.X_OK), '\"'\"'nonempty executable artifact required'\"'\"''"]
depends = ["build"]

[tasks."vuln"]
run = ["govulncheck ./..."]

[tasks."clean"]
run = ["python3 -c 'from pathlib import Path; import shutil; p=Path('\"'\"'.artifacts/build'\"'\"'); assert not p.parent.is_symlink() and not p.is_symlink(), '\"'\"'linked build output'\"'\"'; shutil.rmtree(p) if p.exists() else None'"]

[tasks."_build"]
run = ["bash -euo pipefail -c 'test ! -L .artifacts && test ! -L .artifacts/build; mkdir -p .artifacts/build; go build -trimpath -o .artifacts/build/app .'"]
hide = true

[tasks."_unit"]
run = ["go test -race -count=1 ./..."]
hide = true

[tasks."_test-stages"]
run = [{"task" = "unit"}]
hide = true

[tasks."test"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _test-stages"

[tasks."_check-stages"]
run = [{"task" = "install"}, {"task" = "lint"}, {"task" = "unit"}, {"task" = "build"}, {"task" = "artifact-check"}, {"task" = "vuln"}]
hide = true

[tasks."check"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" session --test unit -- mise run _check-stages"
